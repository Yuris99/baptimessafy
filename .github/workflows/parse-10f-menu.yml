name: Parse 10F Menu

on:
  push:
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parse-10f-menu
  cancel-in-progress: false

jobs:
  parse-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @google/genai

      - name: Find images
        id: find-images
        shell: bash
        run: |
          if find images -maxdepth 1 -type f -iname "*.png" -print -quit | grep -q .; then
            echo "Found PNG images"
            find images -maxdepth 1 -type f -iname "*.png" -print
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "No images found"
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse all images
        if: steps.find-images.outputs.has_images == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data-10f

          find images -maxdepth 1 -type f -iname "*.png" -print0 |
          while IFS= read -r -d '' img; do
            echo "Parsing: $img"

            if node parse-10f-menu.js "$img"; then
              echo "Parsed successfully: $img"
              rm -- "$img"
            else
              echo "Failed to parse: $img"
            fi
          done

      - name: Commit and push results safely
        if: steps.find-images.outputs.has_images == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data-10f images

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Parse 10F menu images"

          git pull --rebase origin main
          git push origin HEAD:main
